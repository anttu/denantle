<!doctype html>
<html lang="fi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Lue satunnaisia Simple English Wikipedian artikkeleita.">
  <title>Wikipedia-lukija</title>
  <link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="images/icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="images/apple-touch-icon.png">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 40px 24px; font: 16px/1.6 system-ui, sans-serif; color: #202020; background: #fafafa; }
    main { max-width: 760px; margin: 0 auto; }
    header { border-bottom: 1px solid #ddd; padding-bottom: 24px; }
    .site-heading { display: flex; align-items: center; gap: 16px; }
    .site-icon { display: block; width: 64px; height: 64px; flex-shrink: 0; }
    h1 { margin: 0; font-size: 28px; line-height: 1.3; }
    .hint, #status, .source { color: #666; font-size: 14px; }
    .hint { margin: 8px 0 24px; }
    button { font: inherit; border: 1px solid #202020; border-radius: 4px; padding: 10px 12px; background: #202020; color: white; cursor: pointer; }
    button:disabled { opacity: .5; cursor: wait; }
    :focus-visible { outline: 2px solid #1769d2; outline-offset: 3px; }
    #status { min-height: 1.6em; margin: 12px 0 0; }
    #error { color: #b00020; margin: 0; }
    article { padding-top: 32px; }
    #article-title { margin: 0 0 12px; font: bold 36px/1.2 Georgia, serif; overflow-wrap: anywhere; }
    #article-body { font: 18px/1.8 Georgia, serif; white-space: pre-wrap; overflow-wrap: anywhere; }
    .source { margin: 0 0 24px; }
    a { color: #1769d2; }
    @media (max-width: 480px) {
      body { padding: 24px 16px; }
      #article-title { font-size: 30px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="site-heading">
        <img class="site-icon" src="images/denantle-icon.png" alt="Denantle-hahmo" width="64" height="64">
        <h1>Wikipedia-lukija</h1>
      </div>
      <p class="hint">Lue satunnainen artikkeli Simple English Wikipediasta.</p>
      <button id="random-article" type="button">Satunnainen artikkeli</button>
      <p id="status" role="status"></p>
      <p id="error" role="alert"></p>
    </header>
    <article id="article" lang="en" aria-labelledby="article-title" hidden>
      <h2 id="article-title"></h2>
      <p class="source" lang="fi">
        Lähde: <a id="article-source">Simple English Wikipedia</a> ·
        <a href="https://creativecommons.org/licenses/by-sa/4.0/">CC BY-SA 4.0</a>
      </p>
      <div id="article-body"></div>
    </article>
    <noscript><p>Satunnaisen artikkelin näyttäminen edellyttää JavaScriptin sallimista selaimessa.</p></noscript>
  </main>
  <script src="categories.js"></script>
  <script src="wikipedia.js"></script>
</body>
</html>
