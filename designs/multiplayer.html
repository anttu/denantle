<html lang="fi">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Denantle · kolme yhteysnäkymää</title>
    <link rel="icon" href="../favicon.ico">
    <style>
    :root {
      color-scheme: light;
      --paper: #fcfbf7;
      --ink: #282920;
      --muted: #727465;
      --rule: #d9d9cc;
      --olive: #62694e;
      --wash: #eeefe5;
      --green: #426240;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      background: #eae9e2;
      color: var(--ink);
      font:
        14px / 1.55 system-ui,
        sans-serif;
    }
    button,
    input,
    textarea {
      font: inherit;
    }
    button {
      cursor: pointer;
    }
    button,
    a,
    input,
    textarea {
      outline-offset: 4px;
    }
    button:focus-visible,
    a:focus-visible,
    input:focus-visible,
    textarea:focus-visible {
      outline: 2px solid var(--olive);
    }
    button:disabled {
      cursor: default;
      opacity: 0.45;
    }
    [hidden] {
      display: none !important;
    }
    h1,
    h2,
    h3,
    p {
      margin: 0;
    }
    button {
      border: 0;
    }
    a {
      color: inherit;
    }
    .design-bar {
      background: #282920;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 32px;
      gap: 20px;
    }
    .design-bar p {
      font-size: 11px;
      letter-spacing: 0.13em;
      text-transform: uppercase;
      color: #d2d4c3;
    }
    .design-bar strong {
      font-weight: 550;
      font-size: 13px;
    }
    .design-nav {
      display: flex;
      gap: 5px;
    }
    .design-nav a {
      padding: 9px 14px;
      text-decoration: none;
      font-size: 12px;
      border: 1px solid #ffffff28;
      border-radius: 4px;
      color: #d2d4c3;
    }
    .design-nav a[aria-current='page'] {
      color: var(--ink);
      background: var(--paper);
      border-color: var(--paper);
    }
    .design-intro {
      width: min(1040px, 100%);
      margin: auto;
      padding: 30px 0 22px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 30px;
    }
    .design-title {
      display: flex;
      align-items: center;
      gap: 15px;
    }
    .design-number {
      border: 1px solid #bfc0b0;
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      font:
        20px Georgia,
        serif;
      border-radius: 50%;
    }
    .design-intro h1 {
      font:
        27px / 1.2 Georgia,
        serif;
      letter-spacing: -0.025em;
    }
    .design-intro p {
      color: #666a5a;
      font-size: 12px;
      margin-top: 4px;
    }
    .design-tag {
      font-size: 10px;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      color: #62694e;
      border-bottom: 1px solid #a7ad96;
      padding-bottom: 4px;
      white-space: nowrap;
    }
    .stage {
      max-width: 1040px;
      margin: 0 auto 28px;
      background: var(--paper);
      border: 1px solid #d4d4c6;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 14px 40px #28292008;
      position: relative;
      min-height: 730px;
    }
    .game-page {
      max-width: 720px;
      margin: 0 auto;
      padding: 28px 0 40px;
    }
    .masthead {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 19px;
      border-bottom: 1px solid var(--rule);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
    }
    .brand-icon {
      width: 53px;
      height: 53px;
    }
    .brand-name {
      width: 143px;
    }
    .brand-name img {
      width: 100%;
      display: block;
    }
    .brand-name img + img {
      margin-top: -13%;
    }
    .help {
      width: 29px;
      height: 29px;
      border: 1px solid #a9ad99;
      border-radius: 50%;
      background: transparent;
      color: var(--muted);
      font:
        16px Georgia,
        serif;
    }
    .welcome {
      padding: 23px 0 22px;
    }
    .eyebrow {
      font-size: 9px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 650;
    }
    .welcome h2 {
      font:
        36px / 1.12 Georgia,
        serif;
      letter-spacing: -0.04em;
      margin: 9px 0;
    }
    .welcome p:last-child {
      font-size: 12px;
      color: var(--muted);
    }
    .controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      margin: 0 0 15px;
    }
    .source-choice {
      border: 1px solid var(--rule);
      padding: 8px 12px;
      border-radius: 4px;
    }
    .new-game {
      font-size: 11px;
      background: none;
      color: var(--ink);
    }
    .modes {
      display: inline-flex;
      gap: 3px;
      padding: 3px;
      border: 1px solid var(--rule);
      border-radius: 5px;
      margin-bottom: 15px;
    }
    .modes span {
      font-size: 11px;
      padding: 7px 13px;
      border-radius: 3px;
      color: var(--muted);
    }
    .modes .selected {
      background: var(--ink);
      color: var(--paper);
    }
    .network {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 10px;
      color: var(--muted);
    }
    .network svg {
      width: 13px;
      height: 13px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      border: 1px solid var(--ink);
      background: var(--ink);
      color: #fff;
      padding: 11px 16px;
      min-height: 42px;
      border-radius: 5px;
      font-size: 12px;
      font-weight: 550;
    }
    .btn:hover {
      background: #414435;
    }
    .btn svg {
      width: 15px;
      height: 15px;
      flex-shrink: 0;
    }
    .btn.secondary {
      background: transparent;
      color: var(--ink);
      border-color: var(--rule);
    }
    .btn.secondary:hover {
      background: var(--wash);
    }
    .text-btn {
      background: transparent;
      color: var(--muted);
      font-size: 11px;
      padding: 0;
      text-decoration: underline;
      text-underline-offset: 3px;
    }
    .dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #859465;
      flex-shrink: 0;
    }
    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      color: var(--muted);
    }
    .status .dot {
      background: #b18842;
    }
    .field {
      border: 1px solid #cccfbe;
      border-radius: 4px;
      background: white;
      padding: 11px 12px;
      width: 100%;
      color: var(--ink);
      font-size: 12px;
      resize: vertical;
    }
    .field::placeholder {
      color: #8a8c7f;
    }
    .field-label {
      display: block;
      font-size: 11px;
      font-weight: 550;
      margin-bottom: 7px;
    }
    .quiet {
      font-size: 11px;
      color: var(--muted);
    }
    .rule {
      height: 1px;
      background: var(--rule);
    }
    .fake-game {
      margin-top: 26px;
      border-top: 1px solid var(--rule);
      padding-top: 20px;
    }
    .fake-game .progress-label {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      color: var(--muted);
      margin-bottom: 8px;
    }
    .progress {
      height: 3px;
      background: #e6e7dc;
      border-radius: 2px;
      margin-bottom: 17px;
    }
    .progress::before {
      content: '';
      display: block;
      width: 18%;
      height: 100%;
      background: var(--olive);
    }
    .guess {
      border: 1px solid #c5c8b8;
      border-radius: 6px;
      padding: 5px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: white;
      color: #858778;
      font-size: 12px;
    }
    .guess > span {
      padding-left: 10px;
    }
    .guess .btn {
      min-height: 33px;
      padding: 6px 14px;
    }
    .redactions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 7px;
      align-items: center;
      margin-top: 21px;
    }
    .redactions i {
      height: 13px;
      background: var(--ink);
      display: block;
      border-radius: 1px;
      width: 62px;
    }
    .redactions i:nth-child(3n) {
      width: 35px;
    }
    .redactions i:nth-child(4n) {
      width: 87px;
    }
    .redactions span {
      font:
        15px Georgia,
        serif;
    }
    .redactions i:nth-child(7n) {
      background: #697157;
    }
    .demo-note {
      max-width: 1040px;
      margin: 0 auto 35px;
      display: flex;
      justify-content: space-between;
      gap: 20px;
      color: #727465;
      font-size: 11px;
    }
    .demo-controls {
      display: flex;
      gap: 5px;
      align-items: center;
    }
    .demo-controls span {
      margin-right: 4px;
    }
    .demo-controls button {
      background: transparent;
      border: 1px solid #c5c7b9;
      padding: 5px 10px;
      border-radius: 3px;
      color: #626654;
      font-size: 10px;
    }
    .demo-controls button[aria-pressed='true'] {
      background: #dedfd3;
      border-color: #a7ad96;
    }
    .design-note {
      max-width: 420px;
    }
    /* 01 — an embedded connection panel */
    .compact-panel {
      border: 1px solid #ced1be;
      border-radius: 7px;
      overflow: hidden;
    }
    .compact-heading {
      padding: 18px 20px 16px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 20px;
      background: #f3f3eb;
      border-bottom: 1px solid var(--rule);
    }
    .compact-heading h3 {
      font:
        24px / 1.2 Georgia,
        serif;
      letter-spacing: -0.025em;
      margin-bottom: 5px;
    }
    .compact-heading p {
      font-size: 11px;
      color: var(--muted);
    }
    .compact-content {
      padding: 18px 20px;
    }
    .compact-columns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
    }
    .compact-columns > div + div {
      border-left: 1px solid var(--rule);
      padding-left: 24px;
    }
    .step-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 10px;
    }
    .step-num {
      width: 21px;
      height: 21px;
      border: 1px solid #b8bda6;
      color: var(--olive);
      display: grid;
      place-items: center;
      border-radius: 50%;
      font-size: 10px;
      font-weight: 600;
    }
    .compact-columns p {
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 13px;
      max-width: 240px;
    }
    .invite-link {
      font:
        10px / 1.5 ui-monospace,
        monospace;
      border: 1px solid var(--rule);
      background: #f8f8f2;
      padding: 9px 10px;
      border-radius: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 8px;
      color: #737967;
    }
    .compact-columns .btn {
      width: 100%;
      min-height: 38px;
      padding: 8px 10px;
      font-size: 11px;
    }
    .compact-columns textarea {
      height: 46px;
      min-height: 46px;
      margin-bottom: 7px;
      padding: 10px;
      font-size: 11px;
      display: block;
    }
    .compact-footer {
      margin-top: 18px;
      border-top: 1px solid var(--rule);
      padding-top: 12px;
      display: flex;
      justify-content: space-between;
      gap: 15px;
    }
    .connected-panel {
      padding: 19px 20px;
      background: #f0f3e9;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border: 1px solid #cbd5bd;
      border-radius: 6px;
    }
    .connected-panel strong {
      font:
        22px Georgia,
        serif;
    }
    .connected-panel p {
      font-size: 11px;
      color: #64705a;
      margin-top: 4px;
    }
    .connected-panel .status {
      color: #4e6a41;
    }
    .connected-panel .dot {
      background: #6c8657;
    }
    .guest-copy {
      max-width: 440px;
    }
    .guest-copy h3 {
      font:
        23px Georgia,
        serif;
      margin-bottom: 7px;
    }
    .guest-copy p {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 15px;
    }
    .guest-actions {
      display: flex;
      gap: 12px;
      align-items: center;
    }
    .guest-actions .invite-link {
      flex: 1;
      margin: 0;
    }
    .compact-panel .guest-message {
      background: #f3f3eb;
      padding: 12px 20px;
      border-top: 1px solid var(--rule);
      font-size: 11px;
      color: var(--muted);
    }
    /* 02 — a guided flow */
    .wizard-page {
      padding-top: 24px;
    }
    .wizard-heading {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 26px 0 22px;
    }
    .wizard-heading h2 {
      font:
        34px / 1.2 Georgia,
        serif;
      letter-spacing: -0.035em;
      margin-top: 7px;
    }
    .wizard-heading p:last-child {
      font-size: 12px;
      color: var(--muted);
      margin-top: 9px;
    }
    .back {
      background: none;
      font-size: 11px;
      color: var(--muted);
      padding: 0;
    }
    .wizard-shell {
      display: grid;
      grid-template-columns: 185px 1fr;
      min-height: 380px;
      border: 1px solid #d0d3c0;
      border-radius: 7px;
      overflow: hidden;
    }
    .wizard-rail {
      padding: 25px 20px;
      background: #eeefe4;
      border-right: 1px solid #d0d3c0;
      display: flex;
      flex-direction: column;
    }
    .wizard-rail .eyebrow {
      margin-bottom: 26px;
    }
    .wizard-steps {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    .wizard-steps li {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      position: relative;
      padding-bottom: 29px;
      font-size: 11px;
      color: var(--muted);
    }
    .wizard-steps li:not(:last-child)::after {
      position: absolute;
      content: '';
      left: 10px;
      top: 25px;
      width: 1px;
      height: 24px;
      background: #c3c8b0;
    }
    .wizard-steps .step-num {
      background: #eeefe4;
      flex-shrink: 0;
      margin-top: 1px;
    }
    .wizard-steps strong {
      font-size: 12px;
      font-weight: 550;
      display: block;
      color: var(--ink);
    }
    .wizard-steps small {
      display: block;
      font-size: 10px;
      margin-top: 2px;
    }
    .wizard-steps .active .step-num {
      background: var(--ink);
      color: white;
      border-color: var(--ink);
    }
    .wizard-steps .done .step-num {
      background: #dce2cd;
      border-color: #bdc6a8;
    }
    .rail-foot {
      font-size: 10px;
      color: var(--muted);
      margin-top: auto;
      padding-top: 30px;
    }
    .wizard-main {
      padding: 29px 30px;
      display: flex;
      flex-direction: column;
    }
    .wizard-main h3 {
      font:
        27px / 1.2 Georgia,
        serif;
      letter-spacing: -0.025em;
      margin-bottom: 12px;
    }
    .wizard-main > p {
      font-size: 12px;
      color: var(--muted);
      max-width: 330px;
    }
    .wizard-main label {
      margin-top: 24px;
    }
    .wizard-main textarea {
      min-height: 95px;
      line-height: 1.7;
    }
    .wizard-main .btn {
      align-self: flex-start;
      margin-top: 12px;
    }
    .wizard-hint {
      border-top: 1px solid var(--rule);
      padding-top: 15px;
      margin-top: auto !important;
      font-size: 10px !important;
      color: #818572 !important;
    }
    .wizard-bottom {
      margin-top: 15px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .wizard-summary {
      display: flex;
      gap: 12px;
      align-items: center;
      font-size: 11px;
      color: var(--muted);
    }
    .tiny-article {
      width: 35px;
      height: 43px;
      border: 1px solid #cdd0be;
      background: #f4f4ec;
      padding: 8px 6px;
    }
    .tiny-article i {
      display: block;
      background: #7e846c;
      height: 3px;
      margin-bottom: 4px;
    }
    .tiny-article i:nth-child(2) {
      width: 70%;
    }
    .wizard-summary strong {
      display: block;
      font-size: 11px;
      color: #525744;
      font-weight: 550;
    }
    .wizard-summary span {
      font-size: 10px;
    }
    .wizard-alt {
      padding-top: 20px;
      font-size: 10px;
      color: var(--muted);
    }
    .wizard-status {
      margin-top: 18px;
    }
    .wizard-success {
      margin: auto 0;
    }
    .wizard-success .success-symbol {
      width: 48px;
      height: 48px;
      background: #e4ead9;
      color: #5f7850;
      display: grid;
      place-items: center;
      border-radius: 50%;
      font:
        24px Georgia,
        serif;
      margin-bottom: 18px;
    }
    /* 03 — an invitation modal */
    .modal-stage .game-page {
      padding-top: 28px;
    }
    .modal-stage .fake-game {
      margin-top: 20px;
    }
    .scrim {
      position: absolute;
      inset: 0;
      background: #28292033;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px;
      backdrop-filter: blur(2px);
    }
    .invite-modal {
      width: 520px;
      background: var(--paper);
      border: 1px solid #c5c7b8;
      border-radius: 10px;
      box-shadow: 0 24px 70px #20241826;
      overflow: hidden;
      position: relative;
    }
    .close-modal {
      position: absolute;
      right: 18px;
      top: 18px;
      background: transparent;
      font-size: 23px;
      line-height: 1;
      color: var(--muted);
      width: 25px;
      height: 25px;
    }
    .modal-top {
      background: #eeefe5;
      border-bottom: 1px solid #d7dacb;
      padding: 28px 34px 25px;
      text-align: center;
    }
    .shared-mark {
      position: relative;
      height: 58px;
      width: 144px;
      margin: 0 auto 15px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .player-circle {
      width: 45px;
      height: 45px;
      border: 1px solid #aeb69c;
      background: #fcfbf7;
      border-radius: 50%;
      display: grid;
      place-items: center;
      z-index: 1;
    }
    .player-circle svg {
      width: 21px;
      height: 21px;
      color: var(--olive);
    }
    .player-circle.invited {
      border-style: dashed;
      background: #e7e9dc;
      color: #879071;
    }
    .connection-line {
      position: absolute;
      left: 44px;
      right: 44px;
      top: 28px;
      border-top: 1px dashed #a4ad8e;
    }
    .connection-line::after {
      content: '+';
      position: absolute;
      left: 50%;
      top: -11px;
      background: #eeefe5;
      padding: 0 4px;
      transform: translateX(-50%);
      color: #6c775a;
      font:
        17px Georgia,
        serif;
    }
    .modal-top h2 {
      font:
        32px / 1.15 Georgia,
        serif;
      letter-spacing: -0.035em;
    }
    .modal-top p {
      font-size: 12px;
      color: #737965;
      margin-top: 8px;
    }
    .modal-tabs {
      display: flex;
      border: 1px solid #d2d6c3;
      border-radius: 5px;
      padding: 3px;
      margin: 22px 34px 0;
      background: #f0f1e8;
    }
    .modal-tabs button {
      width: 50%;
      border-radius: 3px;
      font-size: 11px;
      padding: 8px;
      background: none;
      color: var(--muted);
    }
    .modal-tabs button[aria-pressed='true'] {
      background: var(--paper);
      color: var(--ink);
      box-shadow: 0 1px 4px #2829200c;
    }
    .modal-content {
      padding: 22px 34px 24px;
    }
    .ticket {
      border: 1px dashed #b8bfa5;
      border-radius: 5px;
      background: #f5f6ee;
      padding: 15px;
      display: flex;
      gap: 15px;
      align-items: center;
      margin-bottom: 20px;
    }
    .ticket .ticket-copy {
      min-width: 0;
      flex: 1;
    }
    .ticket small {
      font-size: 9px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .ticket .link-preview {
      font:
        11px ui-monospace,

a hyväksyy vastauksesi.</p>` : wizardStep === 1 ? `<h3>Kutsu pelikaveri mukaan.</h3><p>Avaa yhteinen peli lähettämällä tämä linkki kaverillesi. Pysykää samassa lähiverkossa.</p><label class="field-label" for="wizard-invite">Kutsulinkki</label><input class="field" id="wizard-invite" value="anttu.github.io/denantle/#join=D1…" readonly>${copyButton()}<button class="text-btn" style="align-self:flex-start;margin-top:20px" type="button" data-action="next">Lähetin kutsun · seuraava vaihe →</button><p class="wizard-hint">Kaverisi avaa linkin ja lähettää sinulle vastauksen.</p>` : `<h3>Saitko jo vastauksen?</h3><p>Kun kaverisi avaa kutsulinkin, hän saa vastauksen. Pyydä häntä lähettämään se sinulle ja liitä se tähän.</p><label class="field-label" for="wizard-answer">Pelikaverin vastaus</label><textarea class="field" id="wizard-answer" placeholder="Liitä kaverilta saamasi vastaus…" spellcheck="false"></textarea><button class="btn" type="button" data-action="connect" data-requires="wizard-answer" disabled>Hyväksy ja yhdistä &nbsp; →</button><p class="wizard-hint">${icon('copy').replace('<svg', '<svg style="width:11px;height:11px;vertical-align:middle;margin-right:5px"')} Kutsu lähetetty. <button class="text-btn" type="button" data-action="copy">Kopioi linkki uudelleen</button></p>`}</div></section><div class="wizard-bottom"><div class="wizard-summary"><div class="tiny-article" aria-hidden="true"><i></i><i></i><i></i><i></i></div><div><strong>${state === 'guest' ? 'Kutsujan peli odottaa' : state === 'connected' ? 'Yhteinen pelinne' : 'Nykyinen pelisi jaetaan'}</strong><span>${state === 'guest' ? 'Artikkeli avautuu yhteyden muodostuttua.' : 'Simple English Wikipedia · 24 sanaa paljastettu'}</span></div></div>${state === 'connected' ? '<span class="status"><i class="dot" style="background:#718a5b"></i>Yhteys auki</span>' : state === 'guest' ? '<span class="status"><i class="dot"></i>Odotetaan kutsujan hyväksyntää</span>' : waiting()}</div><p class="wizard-alt">${state === 'guest'     const modal = () =>
      `<section class="stage modal-stage"><div class="game-page">${masthead()}${welcome()}${controls()}${modes()}${fakeGame(true)}</div>${modalClosed ? `<div class="modal-collapsed">${state === 'connected' ? '<span class="status"><i class="dot"></i>Kaksinpeli · 2 pelaajaa mukana</span>' : '<span class="status"><i class="dot"></i>Kaksinpelin yhteysasetukset</span>'}<button type="button" class="text-btn" data-action="open">Avaa yhteysnäkymä</button></div>` : `<div class="scrim"><section class="invite-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><button class="close-modal" type="button" aria-label="Sulje kutsuikkuna" data-action="close">×</button><div class="modal-top"><div class="shared-mark" aria-hidden="true"><span class="player-circle">${icon('person')}</span><span class="connection-line"></span><span class="player-circle ${state === 'connected' ? '' : 'invited'}">${icon('person')}</span></div><p class="eyebrow" style="margin-bottom:8px">Denantle kaksin</p><h2 id="modal-title">Hyvä arvaus syntyy yhdessä.</h2><p>Kutsu pelikaveri saman artikkelin äärelle.</p></div>${state === 'connected' ? '' : `<section class="modal-tabs" aria-label="Oma rooli"><button type="button" aria-pressed="${state === 'host'}" data-action="host">Minä kutsun</button><button type="button" aria-pressed="${state === 'guest'}" data-action="guest">Sain kutsun</button></section>`}<div class="modal-content">${state === 'connected' ? `<div class="modal-success"><span class="success-seal">✓</span><h3>Nyt teitä on kaksi.</h3><p>Pelikaveri on mukana. Kaikki arvaukset ovat yhteisiä.</p></div><button type="button" class="btn" data-action="play">Takaisin yhteiseen peliin &nbsp; →</button>` : state === 'guest' ? `<div class="modal-guest"><h3>Tervetuloa mukaan.</h3><p>Kutsu on avattu. Lähetä tämä vastaus takaisin kutsujalle, niin pääsette pelaamaan.</p></div><div class="ticket"><div class="ticket-copy"><small>Vastauksesi kutsujalle</small><div class="link-preview">D1.eyJ0eXBlIjoiYW5zd2Vy…</div></div>${copyButton('Kopioi vastaus')}</div><p class="quiet">Pidä ikkuna auki, kunnes kutsuja hyväksyy vastauksen.</p>` : `<div class="ticket"><div class="ticket-copy"><small>1. Lähetä kutsu kaverille</small><div class="link-preview">anttu.github.io/denantle/#join=D1…</div></div>${copyButton('Kopioi linkki')}</div><label class="field-label" for="modal-answer">2. Liitä kaverilta saamasi vastaus</label><textarea id="modal-answer" class="field" placeholder="Kaverisi avaa kutsun ja lähettää vastauksen…" spellcheck="false"></textarea><button class="btn" type="button" data-action="connect" data-requires="modal-answer" disabled>Yhdistä pelikaveriin &nbsp; →</button><p class="quiet">Kutsulinkki toimii niin kauan kuin tämä sivu on auki.</p>`}</div><div class="modal-footer">${state === 'connected' ? '<span class="status"><i class="dot" style="background:#718a5b"></i>Yhteys auki · 2 pelaajaa</span>' : state === 'guest' ? '<span class="status"><i class="dot"></i>Odotetaan kutsujan hyväksyntää</span>' : waiting()}${network()}</div></section></div>`}</section>`
    function render() {
      document.getElementById('design-number').textContent = '0' + concept
      document.getElementById('design-name').textContent = names[concept][0]
      document.getElementById('design-description').textContent =
        names[concept][1]
      document.getElementById('design-tag').textContent = names[concept][2]
      document.querySelectorAll('.design-nav a').forEach((a, i) => {
        if (i + 1 === Number(concept)) a.setAttribute('aria-current', 'page')
      })
      document.getElementById('preview').innerHTML = {
        1: compact,
        2: wizard,
        3: modal,
      }[concept]()
      document
        .querySelectorAll('[data-state]')
        .forEach((b) =>
          b.setAttribute('aria-pressed', String(b.dataset.state === state)),
        )
    }
    document.addEventListener('input', (e) => {
      document
        .querySelectorAll('[data-requires]')
        .forEach(
          (b) =>
            (b.disabled = !document
              .getElementById(b.dataset.requires)
              .value.trim()),
        )
    })
    document.addEventListener('click', (e) => {
      const b = e.target.closest('button')
      if (!b) return
      if (b.dataset.state) {
        state = b.dataset.state
        modalClosed = false
        wizardStep = 2
        render()
        return
      }
      const action = b.dataset.action
      if (action === 'copy') {
        const s = b.querySelector('span')
        if (s) {
          const old = s.textContent
          s.textContent = '✓ Kopioitu (luonnos)'
          setTimeout(() => {
            if (s.isConnected) s.textContent = old
          }, 2000)
        } else {
          const old = b.textContent
          b.textContent = '✓ Kopioitu (luonnos)'
          setTimeout(() => {
            if (b.isConnected) b.textContent = old
          }, 2000)
        }
        return
      }
      if (action === 'connect') {
        state = 'connected'
        render()
      }
      if (action === 'reset') {
        state = 'host'
        wizardStep = 1
        modalClosed = false
        render()
      }
      if (action === 'next') {
        wizardStep = 2
        render()
      }
      if (action === 'guest' || action === 'host') {
        state = action
        render()
      }
      if (action === 'toggle-role') {
        state = state === 'guest' ? 'host' : 'guest'
        render()
      }
      if (action === 'close') {
        modalClosed = true
        render()
      }
      if (action === 'open') {
        modalClosed = false
        render()
      }
      if (action === 'play') {
        if (concept === '3') {
          modalClosed = true
          render()
        } else {
          document.getElementById('preview').innerHTML =
            `<section class="stage"><div class="game-page">${masthead()}${welcome()}${controls()}${linked()}${fakeGame(true)}</div></section>`
        }
      }
      if (action === 'help' || action === 'new' || action === 'guess') {
        const old = b.textContent
        b.textContent = 'Ulkoasuluonnos'
        setTimeout(() => {
          if (b.isConnected) b.textContent = old
        }, 1600)
      }
    })
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && concept === '3' && !modalClosed) {
        modalClosed = true
        render()
      }
    })
    render()
    </script>
  </body>
</html>
